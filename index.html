<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannawat Knowledge Hub | GEN 5 & SKIN Block</title>

    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F4F7F9;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --accent-skin: #E67E22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #2C3E50, #4A90E2);
            color: white;
            text-align: center;
            padding: 35px 20px 25px;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }

        .site-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 10px;
        }

        /* Search Bar */
        .search-container {
            max-width: 850px;
            margin: -22px auto 15px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 30px;
            padding: 8px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .search-box i {
            color: #888;
            font-size: 18px;
            margin-right: 12px;
        }

        .search-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
        }

        /* แท็บบาร์พับซ่อนได้ (Drawer Bar) */
        .hidden-drawer-toggle {
            max-width: 850px;
            margin: 0 auto 20px;
            padding: 0 20px;
        }

            width: 100%;
            background: linear-gradient(135deg, #6C5CE7, #8E44AD);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: 0.3s;
        }

            opacity: 0.95;
